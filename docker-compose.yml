services:
  app:
    container_name: patisserie-app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    ports:
      - '8080:8080'
    depends_on:
      - patisserie-postgres

  patisserie-postgres:
    image: postgres:17-alpine
    container_name: patisserie-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'

    environment:
      POSTGRES_DB: patisserie_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - /home/nemolucky/docker/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d patisserie_db']
      interval: 5s
      timeout: 5s
      retries: 5
